name: Build Rv2

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch: { }

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # REMOVI a criação de local.properties para debug
      # (não necessário para assembleDebug)
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
      
      # NOVO: Construir módulos dependentes primeiro
      - name: Build tooling module first
        run: |
          ./gradlew :tooling:impl:build --stacktrace || true
          ./gradlew :tooling:api:build --stacktrace || true
      
      # NOVO: Verificar se o JAR foi criado
      - name: Check generated JAR
        run: |
          echo "=== Checking for tooling-api-all.jar ==="
          find . -name "tooling-api-all.jar" -type f 2>/dev/null
          echo "=== Tooling impl build dir ==="
          ls -la tooling/impl/build/libs/ 2>/dev/null || echo "Directory not found"
      
      # MODIFICADO: Adicionei --stacktrace para debug
      - name: Assemble Debug APK
        run: |
          ./gradlew :core:app:assembleDebug --stacktrace --warning-mode=all
      
      - name: List APK files (debug)
        run: ls -la core/app/build/outputs/apk/debug/
      
      # CORRIGIDO: Ajustei os paths para debug (não release)
      - name: Upload arm64-v8a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-debug
          path: core/app/build/outputs/apk/debug/*arm64-v8a*.apk
        if: always()
      
      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-debug
          path: core/app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if: always()
      
      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-debug
          path: core/app/build/outputs/apk/debug/*x86_64*.apk
        if: always()
      
      - name: Upload universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal-debug
          path: core/app/build/outputs/apk/debug/*universal*.apk
        if: always()